<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Page</title>
  </head>
  <body>
    <h1>Sign Request Demo</h1>
    <button id="identify-btn">Call ONAMEA.identify()</button>
    <button id="sign-btn">Call ONAMEA.sign()</button>
    <pre id="output"></pre>
    <script>
      const ONAMEA_KEY = "Onamea"
      const output = document.getElementById("output")

      const getOnameaApi = () => {
        const api = window[ONAMEA_KEY]
        if (api === undefined) {
          throw new Error(`window.${ ONAMEA_KEY } is unavailable`)
        }
        return api
      }

      document.getElementById("identify-btn").addEventListener("click", async () => {
        output.textContent = "Calling ONAMEA.identify()..."
        try {
          const response = await getOnameaApi().identify()
          output.textContent = JSON.stringify(response, null, 2)
        } catch (error) {
          output.textContent = String(error)
        }
      })

      document.getElementById("sign-btn").addEventListener("click", async () => {
        output.textContent = "Calling ONAMEA.sign()..."

        const operation = {
          hash: "5168977c13e5aced3556c919a8c66d220cdec88f137a7296891c346bfe6bf770",
          id: "be@49KHHS3R8B4F0PG94A27CHV9QXFGH9NF4VMMC5UTP2XY4S4MH00",
          type: "CREATE"
        }

        try {
          const response = await getOnameaApi().sign(operation)
          output.textContent = JSON.stringify(response, null, 2)
        } catch (error) {
          output.textContent = JSON.stringify(error, null, 2)
        }
      })
    </script>
  </body>
</html>
